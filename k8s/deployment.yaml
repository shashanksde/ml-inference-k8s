apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-inference-k8s
  labels:
    app: ml-inference-k8s
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-inference-k8s
  template:
    metadata:
      labels:
        app: ml-inference-k8s
    spec:
      containers:
        - name: api
          image: ghcr.io/shashanksde/ml-inference-k8s:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ml-inference-k8s-config
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Liveness -> /healthz : restart the pod if the process wedges.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # Readiness -> /readyz : keep the pod out of the Service until the
          # model has finished loading.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
